version: 2

sources:
  - name: ga4
    database: bigquery-public-data
    schema: ga4_obfuscated_sample_ecommerce
    tables:
      - name: events
        identifier: events_*
        description: >
          Raw GA4 event data from the Google Merchandise Store. Each row represents
          a single event fired on the website. The table is date-partitioned, with
          one table per day named events_YYYYMMDD. The wildcard identifier allows
          dbt to reference all partitions as a single source.